name: Sync plantillas desde Drive (simple)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install gdown
        run: |
          python3 -m pip install --upgrade pip
          pip3 install gdown

      - name: Download Drive folder to .tmp_drive
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          rm -rf .tmp_drive
          mkdir -p .tmp_drive
          gdown --folder "https://drive.google.com/drive/folders/${DRIVE_FOLDER_ID}" -O .tmp_drive

      - name: Build public/plantillas + data/plantillas.json
        run: node scripts/sync-drive-plantillas-from-tmp.mjs

      - name: Commit & push
        run: |
          git config user.name "lucialco-sync-bot"
          git config user.email "sync@lucialco.local"
          git add public/plantillas data/plantillas.json
          git commit -m "Sync plantillas desde Drive" || echo "No changes"
          git push
